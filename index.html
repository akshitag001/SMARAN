<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--APP-START-->
<title>Smaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────
   Paper: cool register paper, not cream.  Quink: royal-blue fountain-pen ink.
   Marigold: the one accent, reserved for "look for this" and the register margin.
   Dark theme is a blackboard, not near-black. */
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEB; --desk:#E2E7E6;
  --ink:#18212E; --ink-2:#435064; --ink-3:#5E6878;
  --rule:#D6DCE1; --rule-strong:#B6BFC8; --ruled:#E3E8EE;
  --quink:#2A3F9D; --quink-press:#1F3080; --on-quink:#FFFFFF; --quink-wash:#E6EAF8; --quink-text:#2A3F9D;
  --marigold:#E09C14; --marigold-wash:#FBEFD2; --marigold-ink:#6B4700; --margin:#EDBE55;
  --done:#2B7446; --done-wash:#E0EFE5; --on-done:#FFFFFF;
  --f-ui:"Mukta","Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
  --f-name:"Tiro Devanagari Hindi","Noto Serif Devanagari","Noto Serif",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141C19; --surface:#1B2521; --sunk:#222D29; --desk:#0E1412;
    --ink:#E9EDE8; --ink-2:#BAC3BD; --ink-3:#95A09A;
    --rule:#2D3934; --rule-strong:#45534D; --ruled:#26312D;
    --quink:#9DAEF5; --quink-press:#B7C4F8; --on-quink:#0F173A; --quink-wash:#232C4B; --quink-text:#AFBDF7;
    --marigold:#F0B53A; --marigold-wash:#382C12; --marigold-ink:#F6D07D; --margin:#8F6E24;
    --done:#72C48F; --done-wash:#1C3326; --on-done:#0D2016;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141C19; --surface:#1B2521; --sunk:#222D29; --desk:#0E1412;
  --ink:#E9EDE8; --ink-2:#BAC3BD; --ink-3:#95A09A;
  --rule:#2D3934; --rule-strong:#45534D; --ruled:#26312D;
  --quink:#9DAEF5; --quink-press:#B7C4F8; --on-quink:#0F173A; --quink-wash:#232C4B; --quink-text:#AFBDF7;
  --marigold:#F0B53A; --marigold-wash:#382C12; --marigold-ink:#F6D07D; --margin:#8F6E24;
  --done:#72C48F; --done-wash:#1C3326; --on-done:#0D2016;
  color-scheme:dark;
}

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance;line-height:1.2}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--quink);outline-offset:2px;border-radius:6px}
.name{font-family:var(--f-name);font-weight:400;letter-spacing:.005em}
.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Stage: phone column, with a notes panel beside it on wide screens ── */
.stage{min-height:100%}
.side{display:none}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--paper);position:relative}
.app > *{padding-inline:20px}
main{flex:1;padding-block:8px 28px;display:flex;flex-direction:column;gap:28px}
@media (min-width:960px){
  body{background:var(--desk)}
  .stage{display:grid;grid-template-columns:minmax(300px,380px) 430px;justify-content:center;align-items:start;gap:56px;padding:28px 24px;height:100%}
  .app{margin:0;height:100%;max-height:900px;overflow-y:auto;border:1px solid var(--rule);border-radius:22px;overscroll-behavior:contain}
  .side{display:flex;flex-direction:column;gap:26px;padding-top:28px;max-height:100%;overflow-y:auto}
  .only-mobile{display:none!important}
}

/* ── Bars ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:8px;min-height:60px;border-bottom:1px solid transparent}
.top.ruled{border-bottom-color:var(--rule)}
.top .spacer{flex:1}
.back{display:inline-flex;align-items:center;gap:2px;min-height:48px;margin-left:-10px;padding:0 10px 0 4px;color:var(--quink-text);font-weight:500;border-radius:10px}
.back:hover{background:var(--quink-wash)}
.linkbtn{min-height:48px;padding:0 10px;margin-right:-10px;color:var(--quink-text);font-weight:500;border-radius:10px}
.linkbtn:hover{background:var(--quink-wash)}
.bar{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--rule);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.tabs{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(3,1fr);padding-block:4px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;justify-content:center;color:var(--ink-3);font-size:14px;font-weight:500;border-radius:12px}
.tab[aria-current="page"]{color:var(--quink-text)}
.tab[aria-current="page"] .ic{stroke-width:2.4}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:14px;font-size:19px;font-weight:600;padding:0 20px;transition:background-color .15s}
.btn-primary{background:var(--quink);color:var(--on-quink)}
.btn-primary:hover{background:var(--quink-press)}
.btn-primary:disabled{background:var(--sunk);color:var(--ink-3);cursor:not-allowed}
.btn-secondary{min-height:52px;font-size:17px;background:var(--surface);border:1.5px solid var(--rule-strong);color:var(--ink)}
.btn-secondary:hover{border-color:var(--quink)}
.btn-text{min-height:48px;font-size:17px;font-weight:500;color:var(--quink-text)}
.btn-text:hover{background:var(--quink-wash)}

/* ── Chips & state markers ── */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;line-height:1;padding:6px 10px 5px;border-radius:999px;white-space:nowrap}
.chip-look{background:var(--marigold-wash);color:var(--marigold-ink)}
.chip-look::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--marigold);flex:none;margin-top:-1px}
.chip-done{background:var(--done-wash);color:var(--done)}
.chip-plain{background:var(--sunk);color:var(--ink-2);font-weight:500}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);font-weight:500}
.sync.off{color:var(--marigold-ink)}
.mk{width:22px;height:22px;border-radius:50%;flex:none;display:inline-grid;place-items:center;margin-top:2px}
.mk svg{width:14px;height:14px;stroke-width:3}
.mk-done{background:var(--done);color:var(--on-done)}
.mk-partly{border:2px solid var(--marigold);background:linear-gradient(90deg,var(--marigold) 50%,transparent 50%)}
.mk-notyet{border:2px solid var(--ink-3)}
.mk-pending{border:2px dashed var(--marigold)}

/* ── Stepper (a real sequence, so it is numbered) ── */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;counter-reset:st}
.steps li{counter-increment:st;font-size:13px;font-weight:500;color:var(--ink-3);padding-top:8px;border-top:3px solid var(--rule);display:flex;gap:5px}
.steps li::before{content:counter(st);font-variant-numeric:tabular-nums;font-weight:700}
.steps li.done{border-top-color:var(--ink-3)}
.steps li.on{border-top-color:var(--quink);color:var(--ink)}

/* ── Home ── */
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand span{font-family:var(--f-name);font-weight:400;font-size:17px;color:var(--ink-3)}
.greet h1{font-size:32px;font-weight:600;letter-spacing:-.015em}
.greet p{color:var(--ink-2);margin-top:6px}
.progress{display:flex;flex-direction:column;gap:8px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-2)}
.progress-row b{font-weight:600;color:var(--ink)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.segs i.on{background:var(--done)}
.route{border-top:1px solid var(--rule)}
.route li{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:40px 1fr 24px;gap:12px;align-items:start;width:100%;text-align:left;padding:18px 4px 18px 0;border-radius:0}
.row:hover .row-name{text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:4px}
.row > .ic{margin-top:6px;color:var(--ink-3)}
.ord{width:36px;height:36px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ord.next{background:var(--quink);border-color:var(--quink);color:var(--on-quink)}
.ord.done{background:var(--done);border-color:var(--done);color:var(--on-done)}
.ord.done svg{width:20px;height:20px;stroke-width:2.6}
.row-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-name{font-size:21px;line-height:1.25}
.row-meta{color:var(--ink-2);font-size:16px}
.row-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:15px}
.next-tag{font-size:13px;font-weight:700;color:var(--quink-text)}

/* End of day */
.eod{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.eod svg.book{width:120px;height:auto}
.eod h2{font-size:28px;font-weight:600;letter-spacing:-.01em}
.eod p{color:var(--ink-2);max-width:36ch}
.ledger{border-top:1.5px solid var(--ink);display:grid}
.ledger div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule);gap:12px}
.ledger dt{color:var(--ink-2)}
.ledger dd{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.dayline{display:grid;gap:0;border-left:2px solid var(--rule);margin-left:4px}
.dayline li{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:6px 0 6px 14px;position:relative;font-size:16px}
.dayline li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--done)}
.linkish{min-height:32px;text-align:left;color:var(--ink)}
.linkish:hover .name{text-decoration:underline;text-underline-offset:3px}
.dayline time{color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── Brief ── */
.head{display:flex;flex-direction:column;gap:6px}
.stop{font-size:15px;color:var(--ink-3);font-weight:500}
.head h1{font-size:34px;line-height:1.15}
.head .place{color:var(--ink-3);font-size:15px}
.teacher{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--rule)}
.teacher .name{font-size:22px}
.teacher span:last-child{color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.when{font-size:16px;color:var(--ink-2)}
.when b{color:var(--ink);font-weight:600}
.rot{display:inline-block;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.summary{font-size:18px;line-height:1.5;max-width:40ch}
.items{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.items li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.items p{font-size:17px;line-height:1.4}
.items .st{font-size:15px;color:var(--ink-3);margin-top:3px}
.items .st.look{color:var(--marigold-ink);font-weight:600}
.empty-note{padding:18px;border:1.5px dashed var(--rule-strong);border-radius:10px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.empty-note b{color:var(--ink);font-weight:600}

/* ── Observe ── */
.who-line{font-size:16px;color:var(--ink-2)}
.who-line .name{color:var(--ink);font-size:18px}
.lookfor{background:var(--marigold-wash);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--ink)}
.lookfor b{font-size:14px;color:var(--marigold-ink);font-weight:700}
.lookfor li{display:flex;gap:8px}
.lookfor li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--marigold);flex:none;margin-top:9px}
.lang{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--ink-2)}
.seg{display:inline-flex;border:1.5px solid var(--rule-strong);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;font-weight:500;font-size:16px}
.seg button + button{border-left:1.5px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--quink);color:var(--on-quink)}
.capture{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px}
#wave{width:100%;height:76px;display:block}
.rec{width:136px;height:136px;border-radius:50%;background:var(--quink);color:var(--on-quink);display:grid;place-items:center;position:relative;transition:background-color .2s}
.rec .ic{width:52px;height:52px;stroke-width:1.8}
.rec:hover{background:var(--quink-press)}
.rec.on{background:var(--surface);color:var(--quink-text);border:3px solid var(--quink)}
.rec.on .ic{fill:currentColor;stroke:none;width:40px;height:40px}
.rec.on::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--marigold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.rec-status{font-size:18px;font-weight:500;text-align:center;min-height:26px}
.rec-status .num{font-weight:700}
.rec-hint{font-size:15px;color:var(--ink-3);text-align:center;max-width:30ch}
.demo-note{font-size:14px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:8px 12px;text-align:center}
.notebox{display:flex;flex-direction:column;gap:8px}
.notebox label{font-size:15px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline}
.notebox textarea{width:100%;min-height:120px;resize:none;border:1.5px solid var(--rule-strong);border-radius:10px;background:var(--surface);padding:12px 14px;font-size:17px;line-height:1.5}
.notebox textarea:focus{outline:none;border-color:var(--quink)}
.notebox textarea[readonly]{background:var(--sunk);border-style:dashed}
.alt{display:flex;justify-content:center}

/* ── Drafting pause ── */
.drafting{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px}
.drafting h1{font-size:26px;font-weight:600}
.quote{border-left:3px solid var(--margin);padding:4px 0 4px 14px;color:var(--ink-2);font-size:17px;line-height:1.5}
.writing{display:flex;flex-direction:column;gap:14px}
.writing i{display:block;height:3px;border-radius:2px;background:var(--rule);position:relative;overflow:hidden}
.writing i::after{content:"";position:absolute;inset:0;background:var(--quink);transform-origin:left;transform:scaleX(0);animation:write 2.4s ease-in-out infinite}
.writing i:nth-child(2){width:86%}.writing i:nth-child(2)::after{animation-delay:.5s}
.writing i:nth-child(3){width:58%}.writing i:nth-child(3)::after{animation-delay:1s}
@keyframes write{0%{transform:scaleX(0)}55%,100%{transform:scaleX(1);opacity:0}45%{opacity:1}}

/* ── Review ── */
.for{display:flex;flex-direction:column;gap:2px}
.for .name{font-size:24px}
.for p{color:var(--ink-2);font-size:16px}
.fcheck{display:flex;flex-direction:column;gap:12px}
.fcheck h2{font-size:17px;font-weight:600}
.fitem{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--rule)}
.fitem p{font-size:17px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice button{min-height:46px;border:1.5px solid var(--rule-strong);border-radius:10px;font-size:15px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.choice button[aria-pressed="true"][data-v="done"]{background:var(--done);border-color:var(--done);color:var(--on-done)}
.choice button[aria-pressed="true"][data-v="partly"]{background:var(--marigold-wash);border-color:var(--marigold);color:var(--marigold-ink)}
.choice button[aria-pressed="true"][data-v="notyet"]{background:var(--sunk);border-color:var(--ink-3);color:var(--ink)}

/* The draft is a register page: a margin line, ruled lines, the mentor's own words. */
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:18px 16px 20px 34px;position:relative;display:flex;flex-direction:column;gap:6px}
.sheet::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--margin)}
.own{font-size:14px;color:var(--ink-3);margin-bottom:10px;display:flex;flex-direction:column;gap:2px}
.own b{font-weight:600;color:var(--ink-2)}
.fl{font-size:15px;font-weight:600;color:var(--quink-text);margin-top:12px}
textarea.ruled{width:100%;border:0;resize:none;overflow:hidden;background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--ruled) 29px,var(--ruled) 30px);background-attachment:local;line-height:30px;font-size:17.5px;padding:0 0 1px;min-height:31px;border-radius:0}
textarea.ruled:focus{outline:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule-strong) 29px,var(--rule-strong) 30px)}
textarea.ruled.do{font-weight:600}
textarea.ruled.how{color:var(--ink-2)}
textarea.ruled::placeholder{color:var(--ink-3);font-style:italic}
.acts{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.act{display:grid;grid-template-columns:22px 1fr 40px;gap:10px;align-items:start}
.act .mk{margin-top:4px}
.act-x{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink-3)}
.act-x:hover{background:var(--sunk);color:var(--ink)}
.add{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--quink-text);font-weight:600;font-size:16px;padding:0 8px;margin-left:-8px;border-radius:10px}
.add:hover{background:var(--quink-wash)}
.carry{font-size:14px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.cue{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.4;color:var(--marigold-ink);background:var(--marigold-wash);border-radius:8px;padding:8px 10px;margin-top:4px}
.cue::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--marigold);flex:none;margin-top:6px}
.cue-slot{grid-column:2 / 4}
.raw{border-top:1px solid var(--rule);padding-top:4px}
.raw summary{min-height:48px;display:flex;align-items:center;font-weight:500;color:var(--ink-2);cursor:pointer;list-style:none}
.raw summary::-webkit-details-marker{display:none}
.raw summary::after{content:"Show";margin-left:auto;color:var(--quink-text);font-size:15px}
.raw[open] summary::after{content:"Hide"}
.raw p{color:var(--ink-2);font-size:16px;padding-bottom:8px}
.tools{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:-10px}
.tools button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:10px;color:var(--quink-text);font-weight:500;font-size:16px}
.tools button:hover{background:var(--quink-wash)}
.toast{font-size:15px;color:var(--done);font-weight:600;min-height:22px}

/* ── Saved: the one deliberate motion moment ── */
.saved{display:flex;flex-direction:column;gap:18px;padding-top:10px}

    add(k,{name,village:name.replace(/^(GPS|GMS|EGS) /,''),udise:'233204057'+pad(x+10),teacher,cls,subject,history:hist});
  });
  return {v:3,day:TODAY,route:['jhagariya','ratanpur','bilkhiriya','semri','kolukhedi'],schools:S,visited:{jhagariya:{time:'9:40 am',n:1,checked:1}},queue:0,seq:n};
}

/* ───────────────── Navigation ───────────────── */
function go(screen,opts){opts=opts||{};if(!opts.replace&&S.screen!==screen)S.stack.push({screen:S.screen,sid:S.sid});if(opts.sid)S.sid=opts.sid;S.screen=screen;render(true)}
function back(){stopRec(true);const p=S.stack.pop();if(p){S.screen=p.screen;S.sid=p.sid}else S.screen='home';render(true)}

function syncChip(){
  if(S.offline)return `<span class="sync off" data-sync>${I.cloudOff} No signal${D.queue?', '+plural(D.queue,'note')+' kept on phone':''}</span>`;
  if(D.queue)return `<span class="sync" data-sync>${I.cloud} Syncing ${plural(D.queue,'note')}</span>`;
  return `<span class="sync" data-sync>${I.cloud} All notes synced</span>`;
}
function steps(n){const L=['Brief','Observe','Review','Saved'];return `<ol class="steps" aria-label="Visit steps">${L.map((l,i)=>`<li class="${i+1<n?'done':i+1===n?'on':''}"${i+1===n?' aria-current="step"':''}>${l}</li>`).join('')}</ol>`}
function tabs(){const T=[['today','Today',I.route],['schools','Schools',I.school],['patterns','Patterns',I.grid]];

function topbar(backLabel,right,ruled){return `<header class="top${ruled?' ruled':''}"><button class="back" data-act="back">${I.back}${esc(backLabel)}</button><span class="spacer"></span>${right||''}</header>`}

function routeRow(s,i,nextId){
  const v=D.visited[s.id];const lv=lastVisit(s);const pend=pendingOf(s).length;

const rec={on:false,t0:0,raf:0,levels:[],lastPush:0,stream:null,actx:null,an:null,buf:null,sr:null,demo:false,demoTimer:0,base:'',finalTxt:'',demoWords:null,demoI:0};
async function startRec(){
  rec.on=true;rec.t0=Date.now();rec.levels=[];rec.base=S.note?S.note.trim()+' ':'';rec.finalTxt='';rec.demo=false;
  render();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let srStarted=false;
  if(SR&&!S.offline){
    try{
      const r=new SR();r.lang=S.lang==='hi'?'hi-IN':'en-IN';r.continuous=true;r.interimResults=true;
      r.onresult=e=>{let fin='',int='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+' ';else int+=t}
        rec.finalTxt=fin;S.note=(rec.base+fin+int).trim();setNote()};
      r.onerror=e=>{if(rec.on&&!rec.demo&&/not-allowed|service-not-allowed|audio-capture|network/.test(e.error))startDemo()};
      r.onend=()=>{if(rec.on&&!rec.demo&&rec.sr===r){try{r.start()}catch(_){}}};
      r.start();rec.sr=r;srStarted=true;
    }catch(e){srStarted=false}
  }
  if(!srStarted)startDemo();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    const st=await navigator.mediaDevices.getUserMedia({audio:true});

    rec.stream=st;const AC=window.AudioContext||window.webkitAudioContext;rec.actx=new AC();
    const src=rec.actx.createMediaStreamSource(st);rec.an=rec.actx.createAnalyser();rec.an.fftSize=512;src.connect(rec.an);rec.buf=new Uint8Array(rec.an.fftSize);

}
function startDemo(){
  if(rec.demo)return;rec.demo=true;

}

function drawWave(){
  const c=document.getElementById('wave');if(!c)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);
  const col=cs.getPropertyValue('--quink').trim()||'#2A3F9D',idle=cs.getPropertyValue('--rule-strong').trim()||'#B6BFC8';
  const step=6,n=Math.floor(w/step),now=Date.now();
  if(rec.on&&now-rec.lastPush>70){
    rec.lastPush=now;let lv;
    if(rec.an){rec.an.getByteTimeDomainData(rec.buf);let sum=0;for(let i=0;i<rec.buf.length;i++){const v=(rec.buf[i]-128)/128;sum+=v*v}lv=Math.min(1,Math.sqrt(sum/rec.buf.length)*4)}
    else{const t=(now-rec.t0)/1000;const talk=Math.sin(t*1.3)>-0.55?1:0.15;lv=talk*(0.18+0.5*Math.abs(Math.sin(t*4.1)*Math.sin(t*2.3+1)))+Math.random()*0.18*talk}
    rec.levels.push(lv);if(rec.levels.length>n)rec.levels.shift();
  }
  const off=n-rec.levels.length;
  for(let i=0;i<n;i++){const lv=i>=off?rec.levels[i-off]:0;const bh=Math.max(3,lv*(h-6));g.fillStyle=i>=off&&rec.on?col:idle;
    const x=i*step,y=(h-bh)/2;if(g.roundRect){g.beginPath();g.roundRect(x,y,3,bh,1.5);g.fill()}else g.fillRect(x,y,3,bh)}
  const tm=document.getElementById('timer');if(tm){const sec=Math.floor((now-rec.t0)/1000);tm.textContent=Math.floor(sec/60)+':'+pad(sec%60)}
  if(rec.on)rec.raf=requestAnimationFrame(drawWave);
}

const POS=/(good|well|nice|excited|attentive|cheerful|progress|improvement|clear|अच्छ|सुधार|ध्यान से)/i;
function localDraft(note,lang){
  const L=lang==='hi'?'hi':'en';
  const hits=RULES.map(r=>{const m=note.match(r.k);return m?{r,at:m.index}:null}).filter(Boolean).sort((a,b)=>a.at-b.at).slice(0,2);
  const actions=hits.length?hits.map(h=>({do:h.r[L][0],how:h.r[L][1]})):[{do:L==='hi'?'कल की कक्षा में एक पल चुनें जब आप देखें कि किसे समझ आया।':'Pick one moment in tomorrow\u2019s lesson to check who has understood.',how:L==='hi'?'एक छोटा सवाल पूछें और सबसे एक साथ स्लेट पर जवाब दिखवाएँ।':'Ask one short question and have every child show the answer on a slate at the same time.'}];
  const sents=note.split(/(?<=[.!?।])\s+/).map(x=>x.trim()).filter(Boolean);
  const good=sents.filter(x=>POS.test(x)&&!/\b(but|not|didn.?t|no)\b|नहीं|लेकिन/i.test(x)).slice(0,2);
  const strength=good.length?(L==='hi'?'मैंने देखा: ':'I noticed: ')+good.join(' '):'';
  const topic=(sents[0]||'').replace(/[.।]$/,'');
  const summary=(topic.length<80?topic+'. ':'')+(L==='hi'?'सुझाव: ':'Suggested: ')+actions.map(a=>a.do.replace(/[.।]$/,'').toLowerCase()).join('; ')+'.';
  return {strength,actions,summary:summary.charAt(0).toUpperCase()+summary.slice(1)};
}
function aiPrompt(s){
  const lv=lastVisit(s);
  const prev=lv?lv.items.map(i=>'- '+i.text+' (today: '+(S.check[i.id]?STATE_LABEL[S.check[i.id]]:i.state==='pending'?'not checked':STATE_LABEL[i.state])+')').join('\n'):'None, this is the first visit on record.';
  return `You help a government school mentor in India (a Cluster Resource Person) turn a rough spoken classroom observation into feedback they will give the teacher face to face.

Teacher: ${s.teacher}, ${s.cls}, ${s.subject}, ${s.name}
Suggestions from the last visit:
${prev}

Mentor's raw observation (may mix Hindi and English, may have speech-to-text errors):
"""${S.note.slice(0,3000)}"""

Write in ${S.lang==='hi'?'simple, everyday Hindi in Devanagari script':'plain Indian English'}.
Rules:
- Warm, respectful and specific, the way an experienced colleague speaks. No jargon, no corporate or clinical words, no inflated praise, nothing harsh.
- Speak to the teacher as "you".
- "strength": one or two sentences on something specific that worked, taken only from the observation. If the note mentions nothing positive, return an empty string. Never invent facts.
- "actions": 1 or 2 suggestions, the most important first. "do" is one concrete classroom action the teacher could try tomorrow, under 15 words. "how" is one or two sentences on exactly how to do it in a government school classroom (slates, blackboard, FLN kit, large classes).
- If the observation shows progress on a last-visit suggestion, acknowledge it in "strength".
- "summary": one line under 22 words for the school's visit record, in third person, without pronouns.
Reply with only JSON in this shape: {"strength":"...","actions":[{"do":"...","how":"..."}],"summary":"..."}`;
}
let draftCtl=null;
async function structure(fresh){
  stopRec(true);

  go('drafting',{replace:!!fresh});
  const t0=Date.now();let draft=null,source='';
  if(SAMPLE&&!S.offline&&!S.aiOff){
    draftCtl=new AbortController();
    try{
      const opts={modelTier:'quick',signal:draftCtl.signal};if(fresh)opts.cache=false;
      const r=await SAMPLE.json(aiPrompt(s),opts);
      if(r&&Array.isArray(r.actions)&&r.actions.length){
        draft={strength:String(r.strength||''),summary:String(r.summary||''),actions:r.actions.slice(0,3).map(a=>({do:String(a&&a.do||''),how:String(a&&a.how||'')})).filter(a=>a.do)};
        if(draft.actions.length)source='ai';else draft=null;
      }
    }catch(e){
      if(e&&e.code==='cancelled')return;

    }

  }
  if(!draft){draft=localDraft(S.note,S.lang);source=S.offline?'offline':'local'}
  const wait=Math.max(0,1300-(Date.now()-t0));
  setTimeout(()=>{if(S.screen!=='drafting')return;S.draft=draft;S.source=source;S.screen='review';render(true)},wait);
}
function skipDraft(){
  if(draftCtl){draftCtl.abort();draftCtl=null}
  S.draft={strength:'',actions:[{do:'',how:''}],summary:''};S.source='self';S.screen='review';render(true);
  const f=document.getElementById('f-strength');f&&f.focus();
}

/* Tone check: a calm cue, never a block */
const VAGUE=/\b(improve|improvement|better|try harder|work (on|harder)|be careful|more effort|pay attention|focus more|good job|keep it up|overall|properly|as needed|needs work)\b|सुधार करें|ध्यान दें|बेहतर/i;
const CONCRETE=/\b(\d+|minutes?|rows?|slates?|board|groups?|pairs?|names?|ask|write|show|read|cards?|bundles?|chart|each|every|daily|before|after|start|end|turn)\b|मिनट|स्लेट|बोर्ड|समूह|नाम|हर|रोज़/i;
const HARSH=/\b(poor|bad|careless|lazy|useless|failed|failure|pathetic|waste|disappointing|not serious|incompetent|terrible|never|should know|shameful|hopeless)\b|खराब|लापरवाह|बेकार|नाकाम/i;
function toneCheck(t){
  const f=t.dataset.f;if(!f)return;const key=f.startsWith('do:')||f.startsWith('how:')?'do-'+f.split(':')[1]:f;
  const cue=document.getElementById('cue-'+key);if(!cue)return;
  let txt=t.value;
  if(key.startsWith('do-')){const k=key.split('-')[1];const a=S.draft.actions[+k];txt=a?(a.do+' '+a.how):''}
  let m='';
  if(txt.trim()){
    if(HARSH.test(txt))m='This may land as harsh. Try describing what happened in class rather than the teacher.';
    else if(VAGUE.test(txt)&&!CONCRETE.test(txt))m='This reads a little vague. What exactly should happen in class?';
  }
  cue.hidden=!m;cue.textContent=m;
}
let toneTimers={};

/* Save */
function saveVisit(){
  const s=school();const lv=lastVisit(s);const d=S.draft;
  const items=d.actions.filter(a=>a.do.trim()).map(a=>({id:'i'+(++D.seq),text:a.do.trim().replace(/[.।]$/,''),how:a.how.trim(),state:'pending',checked:null}));
  const closed=[];
  if(lv)lv.items.forEach(i=>{if(i.state==='pending'&&S.check[i.id]){i.state=S.check[i.id];i.checked=TODAY;closed.push({text:i.text,state:i.state})}});
  const time=clock(new Date());
  s.history.unshift({id:'v'+(++D.seq),date:TODAY,mentor:ME.name,time,today:true,summary:(d.summary||'').trim()||items.map(i=>i.text).join('; '),strength:d.strength.trim(),items,note:S.note});
  if(D.route.includes(s.id))D.visited[s.id]={time,n:items.length,checked:closed.length};
  D.queue++;persist();
  S.lastSaved={n:items.length,checked:closed.length,items:closed};
  S.screen='saved';S.stack=S.stack.filter(x=>x.screen==='home');render(true);
  scheduleSync();
}
let syncT=0;
function scheduleSync(){clearTimeout(syncT);if(S.offline||!D.queue)return;syncT=setTimeout(()=>{D.queue=0;persist();document.querySelectorAll('[data-sync]').forEach(el=>{el.outerHTML=syncChip()});if(S.screen==='home')render()},2200)}

function feedbackText(){
  const s=school();let d=S.draft;
  if(S.screen==='saved'||!d){const v=latest(s);d={strength:v.strength||'',actions:v.items.map(i=>({do:i.text,how:i.how||''})),summary:v.summary}}
  const dt=parse(TODAY);const hi=S.lang==='hi';
  const lines=[`Namaste ${firstName(s.teacher)} ji,`,'',hi?`आज (${dt.getDate()} ${MON[dt.getMonth()]}) की कक्षा के बारे में:`:`Notes from today's visit (${dt.getDate()} ${MON[dt.getMonth()]}):`];
  if(d.strength.trim())lines.push('',(hi?'जो अच्छा रहा: ':'What worked: ')+d.strength.trim());
  const acts=d.actions.filter(a=>a.do.trim());
  if(acts.length){lines.push('',hi?'आगे आज़माएँ:':'To try next:');acts.forEach(a=>lines.push('- '+a.do.trim()+(a.how.trim()?' '+a.how.trim():'')))}
  lines.push('',`${ME.name}, ${ME.role}, ${ME.jsk}`);
  return lines.join('\n');
}
async function copyText(){
  const txt=feedbackText();const toast=document.getElementById('toast');
  try{await navigator.clipboard.writeText(txt);if(toast)toast.textContent='Copied. Paste it into WhatsApp.'}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(toast)toast.textContent=ok?'Copied. Paste it into WhatsApp.':'Copy isn\u2019t available here. Select the text in the draft instead.'}
  setTimeout(()=>{if(toast)toast.textContent=''},3500);
}

/* Demo: finish remaining schools with sample notes */
function finishDay(){
  const savedLang=S.lang;
  D.route.forEach((id,n)=>{if(D.visited[id])return;const s=D.schools[id];const note=s.sample?s.sample.en:'';const d=localDraft(note,'en');const lv=lastVisit(s);let closed=0;
    if(lv)lv.items.forEach((i,j)=>{if(i.state==='pending'){i.state=j%2?'partly':'done';i.checked=TODAY;closed++}});
    const h=11+n,time=(h>12?h-12:h)+':'+(n%2?'45':'10')+' '+(h>=12?'pm':'am');
    const items=d.actions.map(a=>({id:'i'+(++D.seq),text:a.do.replace(/[.।]$/,''),how:a.how,state:'pending',checked:null}));
    s.history.unshift({id:'v'+(++D.seq),date:TODAY,mentor:ME.name,time,today:true,summary:d.summary,strength:d.strength,items,note});
    D.visited[id]={time,n:items.length,checked:closed};});
  D.queue=S.offline?D.queue+1:0;persist();S.lang=savedLang;closeSheet();S.tab='today';S.stack=[];S.screen='home';render(true);
}

/* ───────────────── Events ───────────────── */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closesheet'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="closesheet"]'))return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab':tab(v);break;
    case 'back':back();break;
    case 'brief':
      if(S.screen==='saved'){S.stack=[{screen:'home',sid:null}];S.screen='brief';S.sid=id}else go('brief',{sid:id});
      S.note='';S.check={};S.draft=null;S.typing=false;render(true);break;
    case 'history':stopRec(true);go('history',{sid:id});break;
    case 'observe':go('observe');break;
    case 'lang':S.lang=v;if(rec.on){stopRec(true)}render();break;
    case 'rec':rec.on?stopRec():startRec();break;
    case 'typing':stopRec(true);S.typing=!S.typing;render();if(S.typing){const t=document.getElementById('note');t&&t.focus()}break;
    case 'structure':if(canDraft())structure();break;
    case 'skipdraft':skipDraft();break;
    case 'redraft':S.screen='observe';structure(true);break;
    case 'fcheck':S.check[id]=S.check[id]===v?undefined:v;$app.querySelectorAll(`[data-act="fcheck"][data-id="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',String(S.check[id]===b.dataset.v)));break;
    case 'addact':S.draft.actions.push({do:'',how:''});render();{const t=document.getElementById('f-do-'+(S.draft.actions.length-1));t&&t.focus()}break;
    case 'rmact':S.draft.actions.splice(+el.dataset.k,1);if(!S.draft.actions.length)S.draft.actions.push({do:'',how:''});render();break;
    case 'save':saveVisit();break;
    case 'copy':copyText();break;
    case 'editpat':{if(S.editing[id]){const p=PATTERNS.find(x=>x.id===id);const h=document.getElementById('pt-'+id),b=document.getElementById('pb-'+id);if(h)p.title=h.textContent.trim()||p.title;if(b)p.body=b.textContent.trim()||p.body;delete S.editing[id]}else S.editing[id]=true;render();if(S.editing[id]){const b=document.getElementById('pb-'+id);b&&b.focus()}break}
    case 'sheet':openSheet();break;
    case 'closesheet':closeSheet();break;
    case 'offline':S.offline=!S.offline;el.setAttribute('aria-checked',String(S.offline));document.querySelectorAll('[data-sync]').forEach(x=>{x.outerHTML=syncChip()});renderSide();if(S.sheet){const t=$ov.querySelector('.toggle');t&&t.setAttribute('aria-checked',String(S.offline))}scheduleSync();break;
    case 'finishday':finishDay();break;
    case 'reset':try{localStorage.removeItem(KEY)}catch(_){}D=seed();S.stack=[];S.tab='today';S.screen='home';S.note='';S.check={};S.draft=null;closeSheet();render(true);break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='note'){S.note=t.value;const b=document.getElementById('draftbtn');if(b)b.disabled=!canDraft();return}
  if(t.id==='search'){S.q=t.value;const l=document.getElementById('slist');if(l)l.innerHTML=schoolRows();return}
  const f=t.dataset&&t.dataset.f;if(!f||!S.draft)return;
  grow(t);
  if(f==='strength')S.draft.strength=t.value;
  else if(f==='summary')S.draft.summary=t.value;
  else{const [kind,k]=f.split(':');if(S.draft.actions[+k])S.draft.actions[+k][kind]=t.value}
  clearTimeout(toneTimers[f]);toneTimers[f]=setTimeout(()=>toneCheck(t),450);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
window.addEventListener('online',()=>{S.offline=false;render();scheduleSync()});
window.addEventListener('offline',()=>{S.offline=true;render()});
window.addEventListener('resize',()=>{if(S.screen==='observe'&&!rec.on)drawWave()});

render(true);
if(D.queue)scheduleSync();
})();
</script>
